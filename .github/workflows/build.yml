name: Build

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: "src"

      - name: Checkout builds branch
        uses: actions/checkout@v4
        with:
          ref: "builds"
          path: "builds"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "adopt"
          java-version: 17

      - name: Build Plugin
        run: |
          cd src
          ./gradlew make makePluginsJson || true
          mkdir -p ../builds
          cp **/build/*.cs3 ../builds 2>/dev/null || true
          cp build/plugins.json ../builds/repository.json 2>/dev/null || true

      - name: Push Artifacts
        run: |
          cd builds
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Update builds" || true
          git push
